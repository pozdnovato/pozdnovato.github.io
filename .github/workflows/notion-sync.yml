name: Sync from Notion

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Run Notion sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_HOME_PAGE_ID: ${{ secrets.NOTION_HOME_PAGE_ID }}
          NOTION_PROJECTS_DB_ID: ${{ secrets.NOTION_PROJECTS_DB_ID }}
          NOTION_LINKS_DB_ID: ${{ secrets.NOTION_LINKS_DB_ID }}
        run: ruby scripts/sync_notion.rb

      - name: Commit and push if the site changed
        run: |
          git config user.name "notion-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- index.html '*.html' assets/images .notion-manifest.json
          if git diff --cached --quiet; then
            echo "No content changes from Notion."
          else
            git commit -m "Sync content from Notion"
            git push
          fi
